name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      # Fail if openclaw.plugin.json contracts.tools drifts from the tools
      # registered in src/ (undeclared tools are silently hidden from the
      # LLM agent in OpenClaw 2026.6.x — see issue #15).
      - run: pnpm --filter unraidclaw check-contracts

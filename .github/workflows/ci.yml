name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      # Offline behavioural tests for the API routes. The Community
      # Applications suite runs against a trimmed catalog fixture, and the
      # install, update, remove and plugin paths run against injected files and
      # a recording command runner, so CI never reaches the network and never
      # runs docker or the plugin manager.
      - run: pnpm test

      # Fail if openclaw.plugin.json contracts.tools drifts from the tools
      # registered in src/ (undeclared tools are silently hidden from the
      # LLM agent in OpenClaw 2026.6.x, see issue #15).
      - run: pnpm --filter unraidclaw check-contracts
